name: collect

on:
  schedule:
    # Sweep days: 5th, 12th, 19th, 27th of every month.
    # A full sweep is 60 searches but SerpApi caps us at 50/hour, so it's
    # split across separate runs with deliberate headroom.
    #   06:10 -> 40 searches
    #   08:10 -> 20 searches  (finishes the sweep)
    #   10:10 -> up to 20     (catch-up; does nothing if the sweep is done)
    # Times are ALWAYS UTC. GitHub commonly starts these 5-20 minutes late,
    # which is exactly why the runs are 2 hours apart and not 1.
    - cron: "10 6 5,12,19,27 * *"
    - cron: "10 8 5,12,19,27 * *"
    - cron: "10 10 5,12,19,27 * *"

  # Adds a "Run workflow" button in the Actions tab for manual testing.
  workflow_dispatch:
    inputs:
      budget:
        description: "Max API calls this run"
        required: false
        default: "5"

permissions:
  contents: write        # lets the job commit the database back to the repo

concurrency:
  group: collect
  cancel-in-progress: false   # queue runs, never let two overlap

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide this run's budget
        id: budget
        run: |
          # github.event.schedule tells us WHICH cron line fired.
          case "${{ github.event.schedule }}" in
            "10 6 5,12,19,27 * *")  echo "value=40" >> $GITHUB_OUTPUT ;;
            *)                      echo "value=20" >> $GITHUB_OUTPUT ;;
          esac

      - name: Collect
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CALL_BUDGET: ${{ github.event.inputs.budget || steps.budget.outputs.value }}
        run: python collect.py

      - name: Commit data
        run: |
          git config user.name  "flightdip-bot"
          git config user.email "actions@github.com"
          git add data/flightdip.db
          if git diff --staged --quiet; then
            echo "no new data to commit"
          else
            git commit -m "data: sweep $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
